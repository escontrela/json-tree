spring:
  application:
    name: json-tree
  main:
    web-application-type: none

json-tree:
  app-data:
    root-directory: app-data
    history-directory-name: history
    metadata-file-name: metadata.json
  large-preview:
    # Prefer the bounded preview path before multi-megabyte payloads can push the full
    # tree renderer and JavaFX scene graph into unstable territory.
    full-render-max-bytes: 1048576
    # Legacy bounded preview line budget kept for compatibility with the first large-preview pass.
    preview-max-lines: 400
    # Oversized files are materialized into deterministic ASCII pages on disk.
    page-line-count: 400
    # Keep only the current page plus two pages on either side in the warm in-memory window.
    warm-page-radius: 2
    preview-max-depth: 8
    preview-max-children-per-container: 64
